<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>e-Keberhasilan SKTD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy band header carrying the role switch; every borang opens on a 4-stage PBPPP rail (penetapan → P1 → semakan → akhir) whose state decides who may edit what. PP gets a monitoring ledger, PYD gets their own form. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f8fc; --line:#d9e0ea; --line-2:#b7c3d4;
  --fg:#0f1f33; --muted:#5a6b80;
  --navy:#0b2545; --navy-2:#123561; --navy-fg:#eaf1fb; --navy-muted:#9db3d1; --navy-line:#21406b;
  --accent:#1b4a80; --accent-fg:#ffffff; --accent-soft:#e6eefa;
  --emas:#c9a24b; --emas-ink:#8a6a1f; --emas-soft:#f6edd6;
  --ok:#17733f; --ok-soft:#dcf2e4; --warn:#9a5600; --warn-soft:#fff0d1; --bad:#b3261e; --bad-soft:#fde3e1; --info:#5b3fa8; --info-soft:#ece6fb;
  --paper:#ffffff; --paper-ink:#000000; --paper-cyan:#ccffff;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-ui:"Public Sans","Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(11,37,69,.06),0 4px 16px rgba(11,37,69,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1422; --surface:#111e30; --surface-2:#15253a; --line:#22344d; --line-2:#34496a;
  --fg:#e6edf6; --muted:#93a5bd;
  --navy:#06101d; --navy-2:#0d1d33; --navy-fg:#eaf1fb; --navy-muted:#8ea6c6; --navy-line:#1a2f4d;
  --accent:#7fb0ec; --accent-fg:#06213f; --accent-soft:#16304f;
  --emas:#e0bd68; --emas-ink:#e0bd68; --emas-soft:#3a2f15;
  --ok:#6fd49b; --ok-soft:#14321f; --warn:#f0b35a; --warn-soft:#382a12; --bad:#ff8a80; --bad-soft:#3b1917; --info:#b9a5f5; --info-soft:#2a2347;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1422; --surface:#111e30; --surface-2:#15253a; --line:#22344d; --line-2:#34496a;
  --fg:#e6edf6; --muted:#93a5bd;
  --navy:#06101d; --navy-2:#0d1d33; --navy-fg:#eaf1fb; --navy-muted:#8ea6c6; --navy-line:#1a2f4d;
  --accent:#7fb0ec; --accent-fg:#06213f; --accent-soft:#16304f;
  --emas:#e0bd68; --emas-ink:#e0bd68; --emas-soft:#3a2f15;
  --ok:#6fd49b; --ok-soft:#14321f; --warn:#f0b35a; --warn-soft:#382a12; --bad:#ff8a80; --bad-soft:#3b1917; --info:#b9a5f5; --info-soft:#2a2347;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:85%;margin:0;line-height:1.15;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* ---- header ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-fg);border-bottom:1px solid var(--navy-line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:0 0 34px;width:34px;height:34px}
.brand b{display:block;font-family:var(--f-display);font-stretch:80%;font-size:20px;font-weight:750;letter-spacing:.01em;line-height:1}
.brand small{display:block;color:var(--navy-muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.grow{flex:1 1 auto}
.as{display:flex;align-items:center;gap:8px;min-width:0}
.as label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-muted)}
.as select{background:var(--navy-2);color:var(--navy-fg);border:1px solid var(--navy-line);border-radius:8px;padding:7px 10px;max-width:68vw;font-size:14px}
.linklite{background:none;border:0;color:var(--navy-muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.tabs-band{background:var(--navy-2);border-bottom:1px solid var(--navy-line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--navy-muted);padding:11px 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{color:var(--navy-fg);border-bottom-color:var(--emas)}
.tab:hover{color:var(--navy-fg)}
.badge{background:var(--emas);color:#1c1400;border-radius:999px;font-size:11px;font-weight:700;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}

main.wrap{padding-block:22px 64px;display:grid;gap:18px}
.demo-note{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.gold{background:var(--emas);border-color:var(--emas);color:#1c1400}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--emas-soft);color:var(--emas-ink);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:0;padding:14px 16px 16px;min-width:0}
legend{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:15px;padding:0 6px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:4px;min-width:0}
.field label,.lab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input:not([type]),select,textarea{width:100%;min-width:0;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:16px}
textarea{resize:vertical;line-height:1.45}
input:disabled,textarea:disabled,select:disabled{background:var(--surface-2);color:var(--muted)}
.ro{padding:6px 0;min-height:1.5em;white-space:pre-wrap;overflow-wrap:anywhere}
.ro.empty{color:var(--muted);font-style:italic}
.grid-pyd{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* ---- stage rail ---- */
.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:flex;gap:10px;padding:12px 14px;border-right:1px solid var(--line);position:relative;min-width:0}
.step:last-child{border-right:0}
.step .dot{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;border:2px solid var(--line-2);color:var(--muted);background:var(--surface)}
.step b{display:block;font-size:14px;line-height:1.25}
.step small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.step .chip{margin-top:5px}
.step.s-sah1 .dot,.step.s-sah2 .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.s-dihantar .dot{border-color:var(--info);color:var(--info)}
.step.s-dipulang .dot{border-color:var(--bad);color:var(--bad)}
.step.cur{background:var(--accent-soft)}
.step.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--emas)}
.step.s-kunci{opacity:.6}

/* ---- action panel ---- */
.actpanel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:start;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.actpanel.need{border-color:var(--emas);background:linear-gradient(0deg,var(--emas-soft),var(--emas-soft)),var(--surface)}
.actpanel.back{border-color:var(--bad);background:var(--bad-soft)}
.actpanel h3{font-size:19px}
.actpanel p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.checks li{display:flex;gap:7px;align-items:baseline}
.checks .y{color:var(--ok);font-weight:700}
.checks .n{color:var(--bad);font-weight:700}
.actpanel .side{display:grid;gap:8px;justify-items:end;min-width:0}
.pulang-box{grid-column:1/-1;display:grid;gap:8px}
.quote{border-left:3px solid var(--bad);padding:4px 10px;margin-top:8px;font-style:italic;color:var(--fg)}

/* ---- scoreband ---- */
.scoreband{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.3fr);gap:0;background:var(--navy);color:var(--navy-fg);border-radius:var(--r);overflow:hidden}
.sb{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;padding:14px 16px;border-right:1px solid var(--navy-line);align-items:center}
.sb-label{grid-column:1/-1;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--navy-muted)}
.sb-skor{font-family:var(--f-display);font-stretch:75%;font-size:52px;font-weight:800;line-height:1;color:var(--emas)}
.sb-skor.none{color:var(--navy-muted)}
.meter{display:flex;gap:3px}
.meter span{flex:1;height:22px;border-radius:4px;background:var(--navy-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--navy-muted);border:1px solid var(--navy-line)}
.meter .on{background:var(--navy-line);color:var(--navy-fg)}
.meter .cur{background:var(--emas);color:#1c1400;border-color:var(--emas);font-weight:700}
.sb-stats{font-size:12.5px;color:var(--navy-muted);margin-top:6px}
.sb-stats b{color:var(--navy-fg)}
.sb-meta{display:flex;flex-wrap:wrap;gap:6px;align-content:center;padding:14px 16px}
.sb-meta .chip{background:var(--navy-2);color:var(--navy-fg);border-color:var(--navy-line)}
.sb-meta .chip.warn{background:var(--warn-soft);color:var(--warn)}
.sb-meta .chip.ok{background:var(--ok-soft);color:var(--ok)}

/* ---- bidang & sasaran ---- */
.bidang{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bidang-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bidang-head input{flex:1 1 260px;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.bidang-head h3{flex:1 1 260px;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.sas{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.sas:last-child{border-bottom:0}
.sas.gugur .sas-body>*:not(.sas-tools){opacity:.55}
.sas .no{font-family:var(--f-mono);font-weight:600;font-size:15px;width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sas-body{display:grid;gap:10px;min-width:0}
.teks-ro{font-size:15.5px;line-height:1.5;overflow-wrap:anywhere}
.hints{display:flex;flex-wrap:wrap;gap:5px}
.evals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.eval{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:7px;background:var(--surface-2);min-width:0}
.eval.open{background:var(--surface);border-color:var(--accent)}
.eval h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.eval .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eval .mark{width:92px;flex:0 0 92px;font-family:var(--f-mono);text-align:center}
.eval .row select{width:auto;flex:0 0 auto}
.markro{font-family:var(--f-mono);font-weight:600;font-size:17px}
.asal{font-size:12px;color:var(--warn)}
.sas-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.confirm{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--bad);flex-wrap:wrap}
.add-row{padding:10px 14px;background:var(--surface-2)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}

/* bukti */
.bukti{display:grid;gap:5px}
.file{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.file svg{flex:0 0 16px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8}
.file span.n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--muted);white-space:nowrap}
.upl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}
.upl input{position:absolute;width:1px;height:1px;opacity:0}

/* thread */
details.thread{border-top:1px dashed var(--line);padding-top:8px}
details.thread summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent);display:flex;gap:7px;align-items:center;list-style:none}
details.thread summary::-webkit-details-marker{display:none}
details.thread summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.thread[open] summary::before{transform:rotate(90deg)}
.msgs{display:grid;gap:8px;margin:10px 0}
.m{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.av.pp1{background:var(--emas-soft);color:var(--emas-ink)}
.av.pp2{background:var(--info-soft);color:var(--info)}
.m .h{font-size:12px;color:var(--muted)}
.m .h b{color:var(--fg)}
.m .t{overflow-wrap:anywhere}
.reply{display:flex;gap:8px;align-items:flex-end}
.reply textarea{flex:1}

/* ---- pantau ---- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:14px 16px;display:grid;gap:2px}
.tile .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:40px;line-height:1.05}
.tile .s{font-size:13px;color:var(--muted)}
.tile.hot{border-color:var(--emas);background:linear-gradient(0deg,var(--emas-soft),var(--emas-soft)),var(--surface)}
.tile.hot .v{color:var(--emas-ink)}
.tile.badv .v{color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.ledger{display:grid}
.lrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.5fr) 128px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:9px;background:var(--surface-2)}
.lrow .nm b{display:block;font-size:15px}
.lrow .nm small{color:var(--muted);font-size:13px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.track i{height:9px;border-radius:3px;background:var(--line)}
.track i.sah2{background:var(--ok)}
.track i.sah1{background:linear-gradient(90deg,var(--ok) 50%,var(--line) 50%)}
.track i.dihantar{background:var(--info)}
.track i.dipulang{background:var(--bad)}
.track i.draf{background:var(--line-2)}
.track-l{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.skr{font-size:13px;color:var(--muted)}
.skr b{font-family:var(--f-mono);font-size:16px;color:var(--fg)}
.flags{display:flex;flex-wrap:wrap;gap:5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:8px;border-radius:2px;display:inline-block}

/* ---- head for PP review ---- */
.revhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.revhead h2{font-size:24px}
.revhead small{color:var(--muted);display:block}

/* ---- aktiviti ---- */
.log{display:grid}
.log .e{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start;font-size:14px}
.log .e:last-child{border-bottom:0}
.log .e time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.log .e .w{font-size:12.5px;color:var(--muted)}

/* ---- panduan ---- */
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.guide .card{padding:16px 18px}
.guide h3{font-size:19px;margin-bottom:6px}
.guide p,.guide li{color:var(--fg);max-width:65ch}
.parts{display:grid;gap:8px;margin-top:8px}
.parts div{display:grid;grid-template-columns:26px 1fr;gap:8px}
.parts b{width:24px;height:24px;border-radius:6px;background:var(--emas-soft);color:var(--emas-ink);display:grid;place-items:center;font-family:var(--f-mono)}
.tbl-wrap{overflow-x:auto}
table.mini{border-collapse:collapse;width:100%;font-size:14px}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.mini th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* ---- paper (official form look stays black-on-white in both themes) ---- */
.pv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.paper-wrap{overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.paper{background:var(--paper);color:var(--paper-ink);width:1080px;padding:26px 28px;font:11px/1.35 Arial,Helvetica,sans-serif;margin:0 auto;box-shadow:var(--shadow)}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.paper .ph .t{font-weight:700;font-size:13px;line-height:1.5}
.paper .ph .lg{text-align:center;font-weight:700;font-size:10px;width:180px}
.paper .ph .lg i{display:block;width:48px;height:48px;margin:0 auto 4px;border:2px solid var(--paper-ink);border-radius:50%}
.paper table{border-collapse:collapse;width:100%;table-layout:fixed}
.paper td{border:1px solid var(--paper-ink);padding:4px 5px;vertical-align:top;overflow-wrap:anywhere}
.paper .cy{background:var(--paper-cyan);font-weight:700}
.paper .c{text-align:center;vertical-align:middle}
.paper .nb{border:0}
.paper .gap{height:10px}
.paper .blk{background:var(--paper-ink)}
.paper .sig td{height:34px;font-size:10px}

/* ---- dialog & toast ---- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(640px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(6,16,29,.55)}
.dlg{padding:18px 20px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.out{border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px;min-height:48px;background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-fg);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;font-size:14px;max-width:calc(100vw - 32px)}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lrow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
  .lrow.head{display:none}
  .lrow .trk{grid-column:1/-1;order:3}
  .lrow .skr{order:2}
  .lrow .flags{grid-column:1/-1;order:4}
  .lrow .go{order:5;grid-column:1/-1;justify-self:start}
  .scoreband{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sb-meta{grid-column:1/-1;border-top:1px solid var(--navy-line)}
}
@media (max-width:760px){
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step:nth-child(2){border-right:0}
  .step:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .evals{grid-template-columns:1fr}
  .actpanel{grid-template-columns:1fr}
  .actpanel .side{justify-items:start}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:440px){
  .sb{padding:12px}
  .sb-skor{font-size:42px}
  .sas{grid-template-columns:1fr;gap:8px}
  .rail{grid-template-columns:1fr}
  .step{border-right:0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .tile .v{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>

/* ---------------- interaksi ---------------- */
function curB() { return ui.tab === "semak" ? DB.borang[ui.open] : DB.borang[me().id]; }
function findS(b, id) { for (const x of b.bidang) { const i = x.sasaran.findIndex(s => s.id === id); if (i >= 0) return [x, i, x.sasaran[i]]; } return [null, -1, null]; }
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
function refreshScores(b) { const el = $("#scores"); if (el) el.innerHTML = scoreband(b); }

document.addEventListener("input", e => {
  const t = e.target, b = curB(); if (!b) return;
  if (t.dataset.pyd) { b.pyd[t.dataset.pyd] = t.value; save(); return; }
  if (t.dataset.bn) { const x = b.bidang.find(x => x.id === t.dataset.bn); if (x) { x.nama = t.value; save(); } return; }
  const f = t.dataset.f; if (!f || f === "status") return;
  const [, , s] = findS(b, t.dataset.sid); if (!s) return;
  if (f === "m1" || f === "m2") return; // diproses semasa change
  s[f] = t.value; save();
  if (f === "teks") { const h = $("#h-" + s.id); if (h) h.innerHTML = hints(s.teks).map(([k, x]) => `<span class="chip ${k}">${esc(x)}</span>`).join(""); refreshScores(b); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "as") { ui.as = t.value; ui.open = null; ui.tab = ""; ui.pend = null; ui.filter = "semua"; render(); window.scrollTo(0, 0); return; }
  if (t.id === "pv") { ui.pv = t.value; render(); return; }
  const b = curB(); if (!b) return;
  if (t.dataset.upl) {
    const [, , s] = findS(b, t.dataset.sid); if (!s) return;
    [...t.files].forEach(fl => s.bukti.push(F(fl.name, fl.size / 1024, t.dataset.upl, todayISO())));
    log(b, `Memuat naik ${t.files.length} bukti`); save(); render(); toast(`${t.files.length} bukti ditambah`); return;
  }
  const f = t.dataset.f; if (!f) return;
  const [, , s] = findS(b, t.dataset.sid); if (!s) return;
  if (f === "status") { const old = s.status; s.status = t.value; log(b, `Menukar status sasaran daripada ${old} kepada ${t.value}`); save(); render(); return; }
  if (f === "m1" || f === "m2") {
    const v = normalizeMark(t.value), old = s[f];
    if (v === old) { t.value = v; return; }
    if (me().peranan === "PP1") { if (s[f + "_asal"] === undefined) s[f + "_asal"] = old; log(b, `Mengubah markah ${f === "m1" ? "P1" : "akhir"} daripada ${old || "–"} kepada ${v || "–"}`); }
    s[f] = v; save(); render(); return;
  }
});
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]"); if (tab) { ui.tab = tab.dataset.tab; ui.pend = null; render(); return; }
  const fb = e.target.closest("[data-filter]"); if (fb) { ui.filter = fb.dataset.filter; render(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, b = curB(), i = Number(a.dataset.i);
  const pg = b && !Number.isNaN(i) && STAGES[i] ? b.peringkat[STAGES[i].k] : null;
  switch (act) {
    case "reset": DB = seed(); store(KEY, DB); ui.pend = null; render(); toast("Data contoh dipulihkan"); return;
    case "open": ui.open = a.dataset.u; ui.pv = a.dataset.u; ui.tab = "semak"; ui.pend = null; render(); window.scrollTo(0, 0); return;
    case "back": ui.tab = "pantau"; ui.pend = null; render(); return;
    case "hantar": if (blocking(b, i).length) return; pg.s = "dihantar"; pg.hantar = todayISO(); log(b, `Menghantar ${STAGES[i].t} kepada PP1`); toast("Dihantar kepada PP1"); break;
    case "tarik": pg.s = "draf"; pg.hantar = null; log(b, `Menarik balik ${STAGES[i].t}`); toast("Ditarik balik. Anda boleh menyunting semula."); break;
    case "sahkan": pg.s = "sah1"; pg.sah1 = todayISO(); pg.pulang = null; log(b, `Mengesahkan ${STAGES[i].t}`); toast(`${STAGES[i].t} disahkan`); break;
    case "pulang-buka": ui.pend = "pulang"; render(); setTimeout(() => { const x = $("#pulang-teks"); if (x) x.focus(); }, 0); return;
    case "pulang-tutup": ui.pend = null; render(); return;
    case "pulang": { const tx = ($("#pulang-teks").value || "").trim(); if (!tx) { toast("Tulis sebab dipulangkan supaya PYD tahu apa perlu dipinda"); $("#pulang-teks").focus(); return; }
      pg.s = "dipulang"; pg.pulang = { teks: tx, tarikh: todayISO() }; pg.hantar = null; ui.pend = null; log(b, `Memulangkan ${STAGES[i].t} untuk pindaan`); toast("Dipulangkan kepada PYD"); break; }
    case "perakui": pg.s = "sah2"; pg.sah2 = todayISO(); log(b, `Memperakui ${STAGES[i].t}`); toast(`${STAGES[i].t} diperakui`); break;
    case "ulas": { const s = findS(b, a.dataset.sid)[2], ta = $("#rp-" + a.dataset.sid), tx = (ta.value || "").trim(); if (!tx) { ta.focus(); return; }
      s.ulasan.push(U(me().id, tx, nowLocal())); ui.pend = "th-" + s.id; toast("Ulasan dihantar"); break; }
    case "bukti-del": { const s = findS(b, a.dataset.sid)[2]; s.bukti = s.bukti.filter(f => f.id !== a.dataset.fid); log(b, "Membuang satu bukti"); break; }
    case "add": { const x = b.bidang.find(x => x.id === a.dataset.bid), pm = perm(b, me().peranan); const s = S("", "", "", pm.semakan && !pm.penetapan ? "TAMBAH" : "KEKAL"); x.sasaran.push(s); ui.pend = null; save(); render(); setTimeout(() => { const t = $("#t-" + s.id); if (t) t.focus(); }, 0); return; }
    case "del": ui.pend = "del-" + a.dataset.sid; break;
    case "bdel": ui.pend = "bdel-" + a.dataset.bid; break;
    case "del-no": ui.pend = null; break;
    case "del-yes": { const [x, k] = findS(b, a.dataset.sid); x.sasaran.splice(k, 1); ui.pend = null; break; }
    case "bdel-yes": b.bidang = b.bidang.filter(x => x.id !== a.dataset.bid); ui.pend = null; break;
    case "up": case "down": { const [x, k] = findS(b, a.dataset.sid), j = act === "up" ? k - 1 : k + 1; if (j < 0 || j >= x.sasaran.length) return; [x.sasaran[k], x.sasaran[j]] = [x.sasaran[j], x.sasaran[k]]; break; }
    case "add-bidang": b.bidang.push({ id: uid(), nama: "BIDANG TUGAS BAHARU", sasaran: [] }); break;
    case "builder": openBuilder(b); return;
    default: return;
  }
  save(); render();
});

/* pembina sasaran */
function builderText() {
  const kk = $("#b-kk").value, u = $("#b-ukur").value.trim(), t = $("#b-tujuan").value.trim(), p = $("#b-peringkat").value.trim();
  return [kk, u, t, p].filter(Boolean).join(" ").replace(/\s+/g, " ") + (u || t ? "." : "");
}
function openBuilder(b) {
  $("#b-bidang").innerHTML = b.bidang.map(x => `<option value="${x.id}">${esc(x.nama)}</option>`).join("");
  $("#b-out").textContent = builderText();
  const d = $("#dlg-builder"); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
}
$("#builder-form").addEventListener("input", () => { $("#b-out").textContent = builderText(); });
$("#b-insert").addEventListener("click", () => {
  const b = curB(), x = b.bidang.find(x => x.id === $("#b-bidang").value); if (!x) return;
  const t = builderText(); if (!$("#b-ukur").value.trim()) { toast("Isi penyata ukuran dahulu"); $("#b-ukur").focus(); return; }
  const pm = perm(b, me().peranan);
  x.sasaran.push(S(t, "", "", pm.semakan && !pm.penetapan ? "TAMBAH" : "KEKAL"));
  ["#b-ukur", "#b-tujuan", "#b-peringkat"].forEach(s => $(s).value = "");
  $("#dlg-builder").close(); save(); render(); toast("Sasaran dimasukkan");
});

/* boot */
$("#as").innerHTML = `<optgroup label="Pegawai Yang Dinilai (PYD)">${pyds().map(u => `<option value="${u.id}">${esc(shortName(u.nama))} · ${esc(u.jawatan)}</option>`).join("")}</optgroup>
  <optgroup label="Pegawai Penilai">${DB.users.filter(u => u.peranan !== "PYD").map(u => `<option value="${u.id}">${u.peranan} · ${esc(shortName(u.nama))} (${esc(u.jawatan)})</option>`).join("")}</optgroup>`;
if (!user(ui.as)) ui.as = "u1";
$("#as").value = ui.as;
if (ui.open && !user(ui.open)) ui.open = null;
render();
})();
</script>

</body></html>
